name: MewUI port

on:
  push:
    paths:
      - 'src/TableViewer.MewUI/**'
      - 'samples/TableViewer.MewUI.Demo/**'
      - 'test/TableViewer.MewUI.Tests/**'
      - 'TableViewer.MewUI.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/mewui-build.yml'
  pull_request:
    paths:
      - 'src/TableViewer.MewUI/**'
      - 'samples/TableViewer.MewUI.Demo/**'
      - 'test/TableViewer.MewUI.Tests/**'
      - 'TableViewer.MewUI.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/mewui-build.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TableViewer.MewUI.slnx
      - run: dotnet build TableViewer.MewUI.slnx -c Release --no-restore
      - run: dotnet test test/TableViewer.MewUI.Tests -c Release --no-build
      - run: dotnet pack src/TableViewer.MewUI -c Release --no-build -o artifacts
